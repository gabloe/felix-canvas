name: Images

# Every pull request builds both images for both platforms, checks that the
# publish step would combine exactly two platform digests per image, and runs
# the compose install from the builds. release.yml calls this with a tag to
# push the images to GHCR, sign them, and run the install again from what was
# published. An image whose version is already published and signed is left
# alone, so releasing a tag again only fills in what is missing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and publish, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: images-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ format('{0}', inputs.tag) == '' && github.ref_type == 'branch' && github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  PUSH: ${{ inputs.tag && 'true' || 'false' }}
  TAG: ${{ inputs.tag }}

jobs:
  # Which images to build. When publishing, an image whose version tag already
  # exists with this workflow's signature is skipped rather than rebuilt and
  # re-signed.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      # GHCR names must be lowercase and the owner is GetFelix.
      - name: Registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@v3
        if: env.PUSH == 'true'

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Images to build
        id: plan
        run: |
          all='[{"name":"felix-canvas","dockerfile":"docker/gateway.Dockerfile"},{"name":"felix-canvas-snapshotter","dockerfile":"docker/snapshotter.Dockerfile"}]'
          if [ "$PUSH" != true ]; then
            echo "images=${all}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${TAG#v}"
          todo='[]'
          for row in $(jq -c '.[]' <<< "$all"); do
            name=$(jq -r .name <<< "$row")
            ref="${REGISTRY}/${OWNER}/${name}"
            digest=$(docker buildx imagetools inspect "${ref}:${version}" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || true)
            if [ -n "$digest" ] && cosign verify "${ref}@${digest}" \
                --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/images\.yml@refs/" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null 2>&1; then
              echo "${ref}:${version} is already published and signed (${digest}); skipping it"
            else
              echo "${ref}:${version} will be built and published"
              todo=$(jq -c --argjson row "$row" '. + [$row]' <<< "$todo")
            fi
          done
          echo "images=${todo}" >> "$GITHUB_OUTPUT"

  # Each platform builds on a runner of its own architecture and, on a tag, is
  # pushed by digest alone; `manifest` then tags one list over both and signs
  # it. This is how Felix publishes its images.
  build:
    name: Image ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: plan
    if: needs.plan.outputs.images != '[]'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
        platform:
          - name: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - name: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # GHCR names must be lowercase and the owner is GetFelix.
      - name: Registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # release.yml has checked that the tag matches the versions in the tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }}

      - name: Build${{ env.PUSH == 'true' && ' and push by digest' || '' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.name }}
          labels: ${{ steps.meta.outputs.labels }}
          # Untagged on a tag: a tag here would point at one platform until
          # the manifest job moved it. Otherwise saved for the install test.
          outputs: >-
            ${{ env.PUSH == 'true'
              && format('type=image,name={0}/{1}/{2},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.OWNER, matrix.image.name)
              || format('type=docker,name={0}/{1}/{2}:ci,dest={3}/image.tar', env.REGISTRY, env.OWNER, matrix.image.name, runner.temp) }}
          # Provenance and SBOM travel with a published image. A tarball for
          # `docker load` cannot carry them.
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      # Recorded on every run, so a pull request exercises the same artifact
      # names the publish step combines. The `--` separators keep one image's
      # download pattern from matching another image whose name extends it.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          if [ "$PUSH" = true ]; then
            touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
          else
            touch "${RUNNER_TEMP}/digests/not-pushed-${ARCH}"
          fi

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests--${{ matrix.image.name }}--${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload the image
        if: env.PUSH != 'true' && matrix.platform.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.image.name }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # On a pull request this only checks that each image's download pattern finds
  # exactly its own two platform digests.
  manifest:
    name: ${{ inputs.tag && 'Publish' || 'Publish (dry run)' }}
    needs: [plan, build]
    if: needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign gets a short-lived certificate for this
      # workflow's OIDC identity, so there is no key to store.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      # GHCR names must be lowercase and the owner is GetFelix.
      - name: Registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Download the platform digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests--${{ matrix.image.name }}--*
          merge-multiple: true

      - name: Exactly two platform digests
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ matrix.image.name }}
        run: |
          ls -1
          count=$(find . -type f | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 platform digests for ${IMAGE}, found ${count}"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3
        if: env.PUSH == 'true'

      - uses: sigstore/cosign-installer@v3
        if: env.PUSH == 'true'

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` only for a version without a pre-release suffix.
      - name: Tags
        if: env.PUSH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag, '-') }}

      - name: Create the manifest list
        if: env.PUSH == 'true'
        id: merge
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
          tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # By digest, never by tag: a tag can be moved and the signature would follow it.
      - name: Sign
        if: env.PUSH == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: What was published
        if: env.PUSH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          printf '```\n%s\ndigest: %s\n```\n' "$TAGS" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  # The release compose file, started the way the self-hosting guide starts
  # it: from the images this run built, or when publishing from GHCR.
  install:
    name: Compose install (${{ matrix.idp }})
    needs: [plan, build, manifest]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result != 'failure' && needs.manifest.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - idp: development sign-in
            files: -f docker-compose.yml
            env_files: --env-file .env
            password: ""
            tests: convergence
          - idp: Dex
            files: -f docker-compose.yml -f dex.yaml
            env_files: --env-file .env --env-file dex.env
            password: password
            tests: convergence
          - idp: self-service rooms
            files: -f docker-compose.yml -f rooms.yaml
            env_files: --env-file .env
            password: ""
            tests: convergence rooms
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: deploy/compose
    env:
      COMPOSE: docker compose ${{ matrix.env_files }} ${{ matrix.files }}
      # Only rooms.yaml reads it.
      CANVAS_INVITE_SECRET: ci-only-invite-secret-0123456789
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # A new GHCR package starts private, so the first release's install test must authenticate.
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load the images this run built
        if: env.PUSH != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images

      - name: Choose the images
        run: |
          if [ "$PUSH" = true ]; then
            echo "CANVAS_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          else
            for tar in "$RUNNER_TEMP"/images/*/image.tar; do docker load -i "$tar"; done
            echo "CANVAS_VERSION=ci" >> "$GITHUB_ENV"
          fi

      - name: Start the install
        run: |
          $COMPOSE up -d
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8787/oidc && exit 0
            sleep 3
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the test dependencies
        working-directory: .
        run: |
          npm ci
          npm run build -w @felix-canvas/model
          npx -w @felix-canvas/web playwright install --with-deps chromium

      - name: Two browsers draw together
        working-directory: web
        env:
          CANVAS_E2E_URL: http://127.0.0.1:8787
          CANVAS_E2E_PASSWORD: ${{ matrix.password }}
        run: npx playwright test ${{ matrix.tests }}

      - name: Logs
        if: failure()
        run: $COMPOSE logs

  # The Helm chart on kind next to the Felix chart, from the images this run
  # built, and two browsers drawing through it.
  chart:
    name: Helm chart on kind
    needs: build
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The Felix release the chart and the compose file are tested against.
      FELIX_VERSION: v0.6.0-preview.5
    steps:
      - uses: actions/checkout@v4

      - name: The Felix chart
        uses: actions/checkout@v4
        with:
          repository: GetFelix/felix
          ref: ${{ env.FELIX_VERSION }}
          path: felix
          sparse-checkout: deploy/helm/felix

      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint deploy/helm/felix-canvas -f deploy/helm/felix-canvas/ci/kind-values.yaml

      - uses: helm/kind-action@v1
        with:
          cluster_name: kind

      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images

      - name: Load the images
        run: |
          for tar in "$RUNNER_TEMP"/images/*/image.tar; do docker load -i "$tar"; done
          kind load docker-image ghcr.io/getfelix/felix-canvas:ci ghcr.io/getfelix/felix-canvas-snapshotter:ci

      - name: Install Felix and the chart
        env:
          FELIX_CHART: ${{ github.workspace }}/felix/deploy/helm/felix
        run: deploy/helm/felix-canvas/ci/kind-install.sh

      - name: Reach the gateway and the sign-in page
        run: |
          kubectl port-forward svc/felix-canvas-gateway 8787:80 &
          kubectl port-forward svc/felix-canvas-idp 9400:9400 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/oidc && exit 0
            sleep 2
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the test dependencies
        run: |
          npm ci
          npm run build -w @felix-canvas/model
          npx -w @felix-canvas/web playwright install --with-deps chromium

      - name: Two browsers draw together
        working-directory: web
        env:
          CANVAS_E2E_URL: http://127.0.0.1:8787
        run: npx playwright test convergence

      - name: Cluster state
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods | tail -100
          kubectl logs -l app.kubernetes.io/instance=felix-canvas --all-containers --tail 100
          kubectl logs felix-broker-0 --tail 100
