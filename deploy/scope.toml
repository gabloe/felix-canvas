# The canvas's scope file: what the gateway relays for one room.
# felix-gateway's docs/configuration.md describes the format. The gateway reads
# it from GATEWAY_SCOPE_FILE; the image carries it at /etc/felix-gateway/scope.toml.

# The slow-link switch in the canvas's toolbar.
allow_throttle = true

# The gateway's write limits. The defaults (50 writes a second per session,
# 100 per person) fit, since the canvas paces its own writes below them.
[limits]
# The compose install with rooms.yaml and the chart's ingress put a proxy in
# front of the gateway, so every browser would share the proxy's address and
# a per-address cap would limit the whole install.
sessions_per_ip = 0
# A tab holds one session, and a second while its history timeline is open.
# A session whose network vanished (a laptop sleeping or changing networks)
# keeps its slot for up to 30 seconds, until the gateway's heartbeat closes
# it, so the default of 8 leaves little room for those beside a few tabs.
sessions_per_principal = 16

[scope]
field = "room"

# The durable edit log.
[[scope.streams]]
alias = "ops"
name = "canvas.ops.{scope}"
actions = ["publish", "subscribe"]
# A long pen stroke is one op at about 18 bytes a point, and a text op can
# carry a 64 KiB update plus its header, so 64 KiB is too small.
max_payload_bytes = 262144

# Cursors and selections, in memory only.
[[scope.streams]]
alias = "presence"
name = "canvas.presence.{scope}"
actions = ["publish", "subscribe"]

# The snapshotter's latest fold of the log, under key "latest".
[[scope.caches]]
alias = "snap"
name = "canvas.snap.{scope}"
actions = ["read"]

# Who is in the room: one entry per session, gone unless refreshed.
[[scope.caches]]
alias = "members"
name = "canvas.members.{scope}"
actions = ["read", "write", "watch"]
ttl_s = 30

# Per-session op sequence numbers.
[[scope.counters]]
alias = "seq"
name = "canvas.seq.{scope}"
actions = ["add"]
